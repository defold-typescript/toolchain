# Checks every library-types lane registry for an upstream that has moved past
# the pin.
#
# `defold-upstream-check.yml` does this for the engine; the library corpus — 35
# upstream repos across the authored, LuaLS, markdown, OpenAPI and script_api
# lanes — had no equivalent, so a stale pin was only ever noticed by hand.
#
# The same job compares the Defold Asset Portal head's entry ids with the pinned
# `asset-portal.json`, so a library newly published there is noticed without
# anyone browsing the portal.
#
# Two GitHub scheduling facts this depends on: a `schedule:` trigger only ever
# runs on the default branch (so edits must land on main to take effect), and it
# is auto-disabled after 60 days without repository activity — `workflow_dispatch`
# is kept so a maintainer can always run it by hand.

name: Library upstream pin check

on:
  schedule:
    # Weekly, Monday 07:00 UTC — eleven hours ahead of the daily engine check,
    # so the two jobs do not contend for the same API rate-limit window.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile

      # Invoked as a file rather than through `bun run` so nothing but the report
      # can reach stdout. Exit 1 here means an upstream could not be read, which
      # is a real failure; drift itself exits 0 and is read out of the JSON below.
      - name: Scan every lane registry for a moved upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/library-upstream-check.ts --json > upstream.json

      # The scan exits 1 when any one of the 35 groups is unreadable, and a step
      # defaults to `if: success()` — so without this the whole corpus's findings
      # would be withheld over a single renamed repo. `!cancelled()` rather than
      # `always()`: a cancelled run should not open issues on its way out.
      - name: Open one issue per stale repo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Running after a failed predecessor means the report may never have
          # been written; consuming it with jq would stack a parse error on top
          # of the real failure.
          if [ ! -s upstream.json ]; then
            echo "no upstream report to consume"
            exit 0
          fi
          jq -r '"\(.reports | length) pin(s), \([.reports[] | select(.actionable)] | length) actionable"' upstream.json
          jq -c '.reports[] | select(.actionable)' upstream.json > actionable.jsonl
          while read -r report; do
            title=$(printf '%s' "$report" | jq -r '.issueTitle')
            # The title is keyed on the repo slug and the upstream version alone,
            # so this finds the issue a previous run opened and stays a no-op
            # until the bump lands.
            existing=$(gh issue list --state open --limit 100 --json number,title \
              --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
            if [ -n "$existing" ]; then
              echo "already tracked as #$existing: $title"
              continue
            fi
            printf '%s' "$report" | jq -r '.issueBody' > issue-body.md
            gh issue create --title "$title" --body-file issue-body.md
          done < actionable.jsonl

      # `!cancelled()` so one unreadable library pin above does not withhold the
      # portal check. Exit 1 here means the portal head could not be read; added
      # or removed entries exit 0 and are read out of the JSON below.
      - name: Compare the Asset Portal's entries with asset-portal.json
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/asset-portal-check.ts --json > portal.json

      - name: Open one issue for unclassified portal entries
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s portal.json ]; then
            echo "no portal report to consume"
            exit 0
          fi
          jq -r '"\(.added | length) added, \(.removed | length) removed"' portal.json
          if [ "$(jq -r '.actionable' portal.json)" != "true" ]; then
            exit 0
          fi
          title=$(jq -r '.issueTitle' portal.json)
          # The title is a constant, so while one issue is open later runs find
          # it and stay quiet until the manifest is re-synced and it is closed.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            echo "already tracked as #$existing: $title"
            exit 0
          fi
          jq -r '.issueBody' portal.json > portal-issue-body.md
          gh issue create --title "$title" --body-file portal-issue-body.md
