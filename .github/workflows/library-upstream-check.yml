# Runs two weekly checks on the library corpus's upstreams.
#
# It compares the Defold Asset Portal head's entry ids with the pinned
# `asset-portal.json`, so a library newly published there is noticed without
# anyone browsing the portal.
#
# It reads each curated repo's newest release for a `types/` folder that
# `resolve` accepts, so a curated target that upstream has made redundant is
# noticed and can be retired.
#
# A pin that upstream has moved past is the daily library update bot's to report
# (`library-update.yml`), so this job scans no pins.
#
# Two GitHub scheduling facts this depends on: a `schedule:` trigger only ever
# runs on the default branch (so edits must land on main to take effect), and it
# is auto-disabled after 60 days without repository activity — `workflow_dispatch`
# is kept so a maintainer can always run it by hand.

name: Library upstream check

on:
  schedule:
    # Weekly, Monday 07:00 UTC — eleven hours ahead of the daily engine check,
    # so the two jobs do not contend for the same API rate-limit window.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile

      # Invoked as a file rather than through `bun run` so nothing but the report
      # can reach stdout. Exit 1 here means the portal head could not be read;
      # added or removed entries exit 0 and are read out of the JSON below.
      - name: Compare the Asset Portal's entries with asset-portal.json
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/asset-portal-check.ts --json --data packages/library-types/data > portal.json

      - name: Open one issue for unclassified portal entries
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s portal.json ]; then
            echo "no portal report to consume"
            exit 0
          fi
          jq -r '"\(.added | length) added, \(.removed | length) removed"' portal.json
          if [ "$(jq -r '.actionable' portal.json)" != "true" ]; then
            exit 0
          fi
          title=$(jq -r '.issueTitle' portal.json)
          # The title is a constant, so while one issue is open later runs find
          # it and stay quiet until the manifest is re-synced and it is closed.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            echo "already tracked as #$existing: $title"
            exit 0
          fi
          jq -r '.issueBody' portal.json > portal-issue-body.md
          gh issue create --title "$title" --body-file portal-issue-body.md

      # `!cancelled()` so an unreadable portal above does not withhold the sweep.
      # Exit 1 here means a curated repo could not be read; a repo whose release
      # ships types exits 0 and is read out of the JSON below.
      - name: Find curated targets whose upstream release ships types
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/shipped-types-check.ts --json --data packages/library-types/data > shipped.json

      - name: Open one issue per repo that ships types
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s shipped.json ]; then
            echo "no shipped-types report to consume"
            exit 0
          fi
          jq -r '"\(.reports | length) repo(s), \([.reports[] | select(.actionable)] | length) actionable"' shipped.json
          jq -c '.reports[] | select(.actionable)' shipped.json > shipped-actionable.jsonl
          while read -r report; do
            title=$(printf '%s' "$report" | jq -r '.issueTitle')
            # The title is keyed on the repo slug and the release, so this finds
            # the issue a previous run opened and stays a no-op until the
            # retirement lands.
            existing=$(gh issue list --state open --limit 100 --json number,title \
              --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
            if [ -n "$existing" ]; then
              echo "already tracked as #$existing: $title"
              continue
            fi
            printf '%s' "$report" | jq -r '.issueBody' > shipped-issue-body.md
            gh issue create --title "$title" --body-file shipped-issue-body.md
          done < shipped-actionable.jsonl
