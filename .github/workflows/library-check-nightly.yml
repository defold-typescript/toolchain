# Checks this repo's library data every night: with this repo's CLI, as the
# release gate does, and with every published CLI that reads one of its data
# folders.
#
# Pull request CI checks library data with this repo's CLI only. Published CLIs
# read the same data once it reaches the data repo, so data that a published CLI
# fails on would otherwise surface only when a user's `resolve` reads it.
#
# A `schedule:` trigger only ever runs on the default branch and is auto-disabled
# after 60 days without repository activity; `workflow_dispatch` is kept so a
# maintainer can always run it by hand.

name: Library check nightly

on:
  schedule:
    # Daily, 06:41 UTC. The minute is off the hour because GitHub delays schedules
    # queued at :00 under load.
    - cron: "41 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile

      - name: Library check with this repo's CLI
        run: bun run library:check

      # Runs after a red above too, so one night reports every CLI that fails.
      - name: Library check with each published CLI that reads the data
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          versions=$(bun scripts/cli-range.ts --all)
          failed=""
          for version in $versions; do
            echo "::group::@defold-typescript/cli@$version"
            bunx "@defold-typescript/cli@$version" library check --data packages/library-types/data \
              || failed="$failed $version"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::library check fails with @defold-typescript/cli$failed"
            exit 1
          fi

      - name: Open an issue when the check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Library check fails on this repo's library data"
          # The title is stable, so this finds the issue an earlier night opened and
          # stays a no-op until a maintainer closes it.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            echo "already tracked as #$existing"
            exit 0
          fi
          gh issue create --title "$title" --body "The nightly \`library check\` failed on \`packages/library-types/data\`: $RUN_URL. A failure with this repo's CLI also stops a release from publishing."
