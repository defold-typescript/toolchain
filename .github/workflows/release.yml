# Release workflow.
#
# Tag-driven (`v*`) publish to npm via OIDC trusted publishing — no tokens.
# Publishing uses `npm` because `bun publish` has no OIDC path
# (oven-sh/bun#15601); npm (Node 24 ships a new enough version) does the OIDC
# token exchange automatically given `id-token: write`.
#
# CI is the sole publish path (the local bun-publish script was retired).
# Re-running the workflow on an existing tag is safe: the real publish step is
# idempotent — it skips any package whose target version is already on npm.
#
# Ordering: require CI's full scope green (scripts/release-ci-gate.ts reads the
# Checks API for this exact commit; waits for a full-scope run, aborts if one is
# red or none finishes in time) -> install (frozen) -> build -> jq stamp
# (version + workspace dep rewrite) -> library check against live data -> require
# the data repo to hold this commit's library data (scripts/release-data-gate.ts
# compares defold-typescript/library-data's data/ with this commit's; waits up to
# 10 minutes for library-data-publish) -> dry-run -> publish. The publish never
# re-runs typecheck/lint/test: it trusts the CI run that validated this commit on
# the full OS matrix and refuses to publish if that run is not green.
#   - Build is load-bearing: cli/tstl-plugin resolve
#     @defold-typescript/transpiler through its built dist/ (its `types`
#     export). Mirrors ci.yml.
#   - The jq stamp rewrites every internal `workspace:*` dep to the concrete
#     version; npm publish does not resolve the workspace protocol the way bun
#     does. (The repo manifests stay pinned at 0.0.0; the tag drives the
#     published version.)
#
# The real publish is fenced behind the ENABLE_NPM_PUBLISH repo variable for a
# safe cutover (the dry-run always runs). One-time npm setup: configure a
# Trusted Publisher for each of
# @defold-typescript/{types,transpiler,tstl-plugin,docs,cli} ->
# repo defold-typescript/toolchain, workflow release.yml. A brand-new package has
# no npm entry to attach a Trusted Publisher to yet, so its first release needs a
# one-time manual `npm publish` (granular token) to create it; OIDC takes over
# from the next release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (without leading v)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      # npm performs the OIDC publish (bun cannot). Node 24 ships npm new enough
      # for trusted publishing; registry-url + no token is the OIDC setup.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Refuse to publish until ci.yml's full scope has passed on THIS commit. The
      # release never re-runs the checks; the gate script reads CI's results from
      # the Checks API (keyed by SHA) and waits while a full-scope check is
      # missing, skipped or still running, so a tag on a commit whose CI ran only
      # the library scopes waits for the full run the tag push starts. Only the
      # newest run of each check counts: an earlier cancelled run cannot veto a
      # later green one, and a later red one still blocks.
      - name: Require CI's full scope green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bun scripts/release-ci-gate.ts --repo "$REPO" --sha "$SHA"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: cli/tstl-plugin resolve @defold-typescript/transpiler
      # through its built dist/ (its `types` export), so a clean checkout cannot
      # typecheck until the workspace is built. Mirrors ci.yml.
      - name: Build
        run: bun run build

      - name: Stamp version and rewrite workspace deps
        shell: bash
        run: |
          # Set .version and rewrite every internal workspace:* dependency to the
          # concrete version. `npm publish` does not understand the workspace
          # protocol, so the rewrite must happen in the manifest before packing.
          JQ='.version = $v
            | to_entries
            | map(
                if (.key | IN("dependencies","devDependencies","peerDependencies","optionalDependencies"))
                   and (.value | type == "object")
                then .value |= with_entries(
                       if (.value | type) == "string" and (.value | startswith("workspace:"))
                       then .value = $v else . end)
                else . end)
            | from_entries'
          for manifest in package.json packages/*/package.json; do
            jq --arg v "$VERSION" "$JQ" "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done

      # After the stamp, so the check selects the data folder this version reads:
      # an unstamped 0.0.0 CLI would select the newest folder instead. Library data
      # that fails here blocks the release until the data or the CLI is fixed.
      - name: Library check against this repo's library data
        run: bun run library:check

      # The CLI reads its library data from the data repo's data/, which
      # library-data-publish writes after a data change reaches main. Refuse to
      # publish until that folder holds exactly this commit's library data, so a tag
      # pushed right after a data merge waits for that merge's publish.
      - name: Require the data repo to hold this commit's library data
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bun scripts/release-data-gate.ts --repo defold-typescript/library-data --sha "$SHA"

      # Dependency order: deps before dependents (types and docs before cli).
      # Idempotent like the real publish below: `npm publish --dry-run` still queries the registry and errors
      # ("cannot publish over the previously published versions") on a version
      # already on npm, so re-running a partially-published tag would die here
      # before reaching the real publish. Skip versions already on npm; a fresh
      # tag still dry-runs every package.
      - name: Publish (dry-run)
        run: |
          for pkg in types transpiler tstl-plugin docs cli; do
            name="@defold-typescript/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on npm — skipping dry-run"
            else
              ( cd "packages/$pkg" && npm publish --dry-run --access public )
            fi
          done

      - name: Publish to npm (OIDC, idempotent)
        if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
        run: |
          # Idempotent: skip any package whose target version is already on npm,
          # so re-running the workflow on an existing tag is safe.
          for pkg in types transpiler tstl-plugin docs cli; do
            name="@defold-typescript/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on npm — skipping"
            else
              ( cd "packages/$pkg" && npm publish --access public )
            fi
          done

  # Closing phase of the release, and the only place the docs site deploys: no push
  # deploys it, so the published site documents the version on npm, and this build
  # sees the tag, so /changelog renders the just-released `## vX.Y.Z` section with
  # its date.
  #
  # It dispatches deploy-docs.yml onto `main` rather than deploying from here: the
  # github-pages environment only permits the default branch, so a run whose ref
  # is refs/tags/v* is rejected at the deploy step.
  #
  # A separate job, not a step, for two reasons: it does not start until `publish`
  # concludes (so a slow npm publish costs it nothing), and it keeps `actions:
  # write` off the publish job, which holds `id-token: write` for OIDC.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    # deploy-docs runs 40795838216 and 40784420472 took 21 and 26 min; 60 min keeps
    # over 2x headroom, with the job timeout as the backstop if the dispatch never
    # lands.
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Deploy the docs so /changelog carries this tag's date
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-docs.yml --ref main --repo "$REPO"

          # `gh workflow run` returns no run id, so find the dispatch just created.
          id=""
          for _ in $(seq 1 24); do
            sleep 5
            id=$(gh run list --repo "$REPO" --workflow deploy-docs.yml \
                   --event workflow_dispatch --limit 5 \
                   --json databaseId,createdAt \
                   --jq "[.[] | select(.createdAt >= \"$before\")] | .[0].databaseId // empty")
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then
            echo "::error::deploy-docs dispatch never appeared; deploy the docs manually."
            exit 1
          fi

          # Poll rather than `gh run watch`: watch's refresh loop is TTY-gated and
          # returns a single snapshot with exit 0 on a non-TTY runner — a false green.
          until [ "$(gh run view "$id" --repo "$REPO" --json status --jq .status)" = "completed" ]; do
            sleep 20
          done
          conclusion=$(gh run view "$id" --repo "$REPO" --json conclusion --jq .conclusion)
          echo "deploy-docs $id: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::docs deploy concluded $conclusion — /changelog may still read Unreleased."
            exit 1
          fi
