name: CI

on:
  # Branch pushes and PRs only — NOT tag pushes. A v* tag is handled by
  # release.yml (which runs its own gate before publishing) and always points
  # at an already-CI-green main commit, so running CI here would just burn a
  # full matrix re-running the same commit.
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    # Lint, typecheck and the workspace builds; the docs site's page build runs in
    # the docs-site job. 45 min is ample headroom and still ends a hung run long
    # before GitHub's 6h default.
    timeout-minutes: 45
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  test:
    strategy:
      # Each OS reports its own result: one runner's failure must not cancel
      # another's and hide a platform-only regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # `bun test` took 12-19 min per OS in run 40777186291 (windows slowest), and the
    # build before it skips the docs site's page build, which the docs-site job
    # runs. 90 min keeps wide headroom and still ends a hung run long before
    # GitHub's 6h default.
    timeout-minutes: 90
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      # Build first: publish-pack / release-bin-smoke tests build the cli, which
      # resolves @defold-typescript/transpiler through its built dist/. A clean
      # checkout has no dist, so test-without-build cannot resolve it.
      - run: bun run build
      - run: bun test --timeout 60000

  docs-site:
    runs-on: ubuntu-latest
    # The docs site's page build took 21-25 min in CI run 40777186291 and deploy-docs
    # run 40795838216. 60 min keeps over 2x headroom and still ends a hung run long
    # before GitHub's 6h default.
    timeout-minutes: 60
    steps:
      # fetch-depth/fetch-tags: build-indexes runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      # The script the docs deploy runs, so a site that would fail to deploy reds CI.
      - run: bun run --filter '@defold-typescript/docs-site' build:site
