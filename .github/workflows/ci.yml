name: CI

on:
  # Branch pushes and PRs only — NOT tag pushes. A v* tag is handled by
  # release.yml (which runs its own gate before publishing) and always points
  # at an already-CI-green main commit, so running CI here would just burn a
  # full matrix re-running the same commit.
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    # The slowest of 20 green runs through 2026-10-21 took 15 min, and the build has
    # grown since. 45 min keeps about 2x headroom and still ends a hung run long
    # before GitHub's 6h default.
    timeout-minutes: 45
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  test:
    strategy:
      # Each OS reports its own result: one runner's failure must not cancel
      # another's and hide a platform-only regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The slowest of 20 green runs through 2026-10-21 took 38 min (windows), and the
    # suite has grown since. 90 min keeps about 2x headroom and still ends a hung
    # run long before GitHub's 6h default.
    timeout-minutes: 90
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      # Build first: publish-pack / release-bin-smoke tests build the cli, which
      # resolves @defold-typescript/transpiler through its built dist/. A clean
      # checkout has no dist, so test-without-build cannot resolve it.
      - run: bun run build
      - run: bun test --timeout 60000
