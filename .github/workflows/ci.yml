name: CI

# The scope job sorts a change's files into the scopes it needs
# (scripts/ci-scope.ts): library data, the library docs site, or everything else.
# A library-data or library-docs change runs only the jobs for its scopes, and any
# other change runs the full suite on all three systems. A release tag runs the
# full scope unless its commit already has the green full run release.yml's CI
# gate accepts, in which case it runs no job; a manual run always runs the full
# scope. release.yml waits for a green full run on the tagged commit before it
# publishes. ci-done passes only when every job the scopes chose passed, so it is
# the one check to require.

on:
  push:
    # A bot branch is checked by its PR's run. Its own push run would see a new or
    # force-pushed branch whose previous head git cannot read, and run the full scope.
    branches: ["**", "!library-update/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # checks: read lets a release tag read its commit's earlier check runs.
    permissions:
      contents: read
      checks: read
    outputs:
      scopes: ${{ steps.scope.outputs.scopes }}
    steps:
      # The whole history, so the diff reaches the PR base or the push's previous
      # head. A base git cannot read makes ci-scope.ts choose the full scope.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME/$REF_TYPE" in
            pull_request/*) base="$PR_BASE" ;;
            push/branch) base="$PUSH_BEFORE" ;;
            push/tag)
              bun scripts/ci-scope.ts --tag --repo "$REPO" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "scopes=full" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          bun scripts/ci-scope.ts --base "$base" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  lint-typecheck:
    needs: scope
    if: contains(needs.scope.outputs.scopes, 'full')
    runs-on: ubuntu-latest
    # Lint, typecheck and the workspace builds; the docs site's page build runs only
    # in the release's docs deploy. 45 min is ample headroom and still ends a hung
    # run long before GitHub's 6h default.
    timeout-minutes: 45
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  test:
    needs: scope
    if: contains(needs.scope.outputs.scopes, 'full')
    strategy:
      # Each OS reports its own result: one runner's failure must not cancel
      # another's and hide a platform-only regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # `bun test` took 12-19 min per OS in run 40777186291 (windows slowest), and the
    # build before it skips the docs site's page build, which only the release's
    # docs deploy runs. 90 min keeps wide headroom and still ends a hung run long
    # before GitHub's 6h default.
    timeout-minutes: 90
    steps:
      # fetch-depth/fetch-tags: bun run build runs build-changelog-dates.ts, which
      # fails loud on a tagless checkout (the /changelog date map is git-tag-sourced).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      # Build first: publish-pack / release-bin-smoke tests build the cli, which
      # resolves @defold-typescript/transpiler through its built dist/. A clean
      # checkout has no dist, so test-without-build cannot resolve it.
      - run: bun run build
      - run: bun test --timeout 60000

  library-data:
    needs: scope
    if: contains(needs.scope.outputs.scopes, 'data') || contains(needs.scope.outputs.scopes, 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth/fetch-tags: bun run build needs the release tags, as in the test job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Library check with this repo's CLI
        run: bun run library:check
      # Published CLIs read the data once it reaches the data repo; the nightly run
      # checks every release that reads it.
      - name: Library check with the oldest and newest published CLI that read each data folder
        run: |
          set -euo pipefail
          # Assigned first: bash ignores a failed substitution in a for list, so the
          # loop would run zero times and pass.
          versions=$(bun scripts/cli-range.ts --ends)
          for version in $versions; do
            echo "::group::@defold-typescript/cli@$version"
            bunx "@defold-typescript/cli@$version" library check --data packages/library-types/data
            echo "::endgroup::"
          done
      # The tests below build the cli, which resolves the transpiler through its dist/.
      - run: bun run build
      - name: Tests that read real library data
        run: |
          set -euo pipefail
          tests=$(bun scripts/ci-scope.ts --real-data-tests)
          bun test --timeout 60000 $(printf './%s ' $tests)

  library-docs:
    needs: scope
    if: contains(needs.scope.outputs.scopes, 'data') || contains(needs.scope.outputs.scopes, 'library-docs')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/library-docs build:site
      - run: bun test --timeout 60000 ./packages/library-docs

  # Runs even when a job it needs failed or the run was cancelled, so it never
  # reports a skip that would read as passing. A job the scopes skipped passes.
  ci-done:
    needs: [scope, lint-typecheck, test, library-data, library-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::CI failed:"
            echo "$failed"
            exit 1
          fi
          echo "Every job the change's scopes chose passed."
